# Compose file for Eventiva Test Runner devcontainer.
# Set POSTGRES_PASSWORD via host env or .env; no committed default is provided.
# For stricter security use Docker secrets or Dev Container secrets and reference them here.
services:
  app:
    image: mcr.microsoft.com/devcontainers/javascript-node:1-22-bookworm
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    init: true
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
