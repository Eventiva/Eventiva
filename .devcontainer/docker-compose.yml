version: '3.8'

services:
  app:
    build:
      context: ..              # Points to project root (parent of .devcontainer)
      dockerfile: .devcontainer/Dockerfile  # Path relative to context
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/eventiva

  db:
    image: postgres:16-alpine
    restart: unless-stopped  # Fixed typo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=eventiva
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: