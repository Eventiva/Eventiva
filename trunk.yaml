# Trunk configuration - https://docs.trunk.io/code-quality/overview
# Run `trunk init` to add/update linters. Keep in sync with .editorconfig, .prettierrc, eslint.config.mjs, and Nx.
version: '0.1'

lint:
    enabled:
        - eslint
        - prettier
        # Recommended for TypeScript/monorepo
        - markdownlint
        - yamllint
        - actionlint
