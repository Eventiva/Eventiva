name: Tests Repo PR TDD

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened

concurrency:
    group: tests-repo-pr-${{ github.event.pull_request.number }}
    cancel-in-progress: true

permissions:
    actions: read
    checks: write
    contents: read
    pull-requests: write

env:
    TESTS_REPO: Eventiva/tests
    NX_NO_CLOUD: 'true'

jobs:
    create-tests:
        name: Create tests from main repo source
        runs-on: ubuntu-latest
        env:
            BRANCH_NAME: ${{ github.head_ref }}
            BASE_BRANCH: ${{ github.base_ref }}
        steps:
            # BOT_TOKEN required to fetch private tests submodule; fallback allows job to start when unset.
            - uses: actions/checkout@v6
              with:
                  token: ${{ secrets.BOT_TOKEN || github.token }}
                  fetch-depth: 0
                  submodules: 'recursive'

            - name: Checkout tests submodule to PR branch
              id: submodule_branch
              env:
                  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
              run: |
                  set -euo pipefail
                  git -C tests config user.name "eventiva-bot"
                  git -C tests config user.email "eventiva-bot@users.noreply.github.com"
                  git -C tests fetch origin --prune

                  default_branch="$(
                    curl -fsSL \
                      -H "Authorization: Bearer ${BOT_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/${TESTS_REPO}" | jq -r '.default_branch'
                  )"
                  if git -C tests ls-remote --exit-code --heads origin "${BRANCH_NAME}" > /dev/null 2>&1; then
                    git -C tests checkout -B "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
                  else
                    git -C tests checkout -B "${BRANCH_NAME}" "origin/${default_branch}"
                  fi
                  echo "default_branch=${default_branch}" >> "$GITHUB_OUTPUT"

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.14.2

            - uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Bootstrap tests repo project structure
              run: |
                  set -euo pipefail
                  node scripts/bootstrap-tests-repo.mjs tests

            - name: Install Cursor CLI
              run: |
                  set -euo pipefail
                  CURSOR_INSTALLER="$(mktemp)"
                  curl -fsSL "https://cursor.com/install" -o "${CURSOR_INSTALLER}"
                  bash "${CURSOR_INSTALLER}"
                  rm -f "${CURSOR_INSTALLER}"
                  echo "$HOME/.cursor/bin" >> "$GITHUB_PATH"

            - name: Run AI test-creator with full main repo access
              env:
                  CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
              run: |
                  set -euo pipefail

                  if ! command -v agent > /dev/null; then
                    echo "Cursor CLI command 'agent' is unavailable after install."
                    exit 1
                  fi

                  git -C tests status --porcelain | awk '{print $2}' | sort -u > pre-agent-files.txt
                  prompt_file="cursor-test-creator-prompt.md"

                  cat > "${prompt_file}" <<EOF
                  You are the dedicated test-creator agent for Eventiva/tests.

                  Hard requirements:
                  1. You have full read access to the main repo implementation in packages/ (all source code).
                  2. Use the implementation code to write exhaustive, correct Effect/Vitest tests.
                  3. Add or update tests for all exported callables and behaviors.
                  4. Never delete existing tests.
                  5. You may add/update Step CI workflow YAML used by tests when needed.
                  6. Keep changes scoped to test assets (tests, workflows, test config).
                  7. Place tests only in Nx project roots under <projectRoot>/src/**/*.spec.ts.
                  8. Use @effect/vitest: it.effect, it.live, it.scoped as appropriate.
                  9. Test both success and failure paths using Effect.exit and Exit.succeed/Exit.fail.
                  10. Ensure projects remain runnable via: nx run-many -t test --projects='tests-*'.

                  You are working in the tests/ submodule directory. The main repo source is at ../packages/.
                  EOF

                  if ! timeout 180 agent -p "$(cat "${prompt_file}")" --force --model auto --workspace tests; then
                    echo "Cursor AI generation timed out or failed; continuing with bootstrap-generated tests."
                  fi

                  git -C tests status --porcelain | awk '{print $2}' | sort -u > post-agent-files.txt
                  comm -13 pre-agent-files.txt post-agent-files.txt > agent-generated-files.txt || true

                  invalid_paths=0
                  while IFS= read -r changed; do
                    if [ -z "${changed}" ]; then continue; fi
                    if [[ "${changed}" =~ ^(core|databases/[^/]+|extensions/[^/]+/[^/]+|platforms/[^/]+)/src/.+\.spec\.[jt]sx?$ ]]; then continue; fi
                    if [[ "${changed}" =~ ^(core|databases/[^/]+|extensions/[^/]+/[^/]+|platforms/[^/]+)/workflows/.+\.(yml|yaml)$ ]]; then continue; fi
                    echo "Disallowed agent-generated path: ${changed}"
                    invalid_paths=1
                  done < agent-generated-files.txt

                  if [ "${invalid_paths}" -ne 0 ]; then
                    echo "Agent attempted to modify disallowed paths."
                    exit 1
                  fi

            - name: Commit and push tests submodule updates
              env:
                  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
              run: |
                  set -euo pipefail
                  cd tests

                  git add .

                  deleted_files="$(git diff --cached --name-status | awk '$1 == "D" { print $2 }')"
                  if [ -n "${deleted_files}" ]; then
                    echo "Refusing to delete files:"
                    printf '%s\n' "${deleted_files}"
                    exit 1
                  fi

                  if git diff --cached --quiet; then
                    echo "No tests repo changes to commit."
                    exit 0
                  fi

                  git commit -m "chore(tdd): update tests for ${BRANCH_NAME}"
                  git push --force-with-lease -u origin "${BRANCH_NAME}"

            - name: Ensure tests repo PR exists
              uses: actions/github-script@v8
              env:
                  BRANCH_NAME: ${{ github.head_ref }}
                  TESTS_REPO: Eventiva/tests
                  MAIN_PR_URL: ${{ github.event.pull_request.html_url }}
              with:
                  github-token: ${{ secrets.BOT_TOKEN }}
                  script: |
                      const [owner, repo] = (process.env.TESTS_REPO ?? "").split("/");
                      const headBranch = process.env.BRANCH_NAME;

                      if (!owner || !repo || !headBranch) {
                        core.setFailed("Missing TESTS_REPO or BRANCH_NAME.");
                        return;
                      }

                      const { data: testsRepo } = await github.rest.repos.get({ owner, repo });
                      const baseBranch = testsRepo.default_branch;

                      if (headBranch === baseBranch) {
                        core.info("Head branch matches tests repo default branch; skipping PR creation.");
                        return;
                      }

                      const headRef = `${owner}:${headBranch}`;
                      const existing = await github.paginate(github.rest.pulls.list, {
                        owner,
                        repo,
                        state: "open",
                        head: headRef,
                        base: baseBranch,
                        per_page: 100
                      });

                      if (existing.length > 0) {
                        core.info(`Open tests repo PR already exists: #${existing[0].number}`);
                        return;
                      }

                      const title = `tdd: sync tests for ${headBranch}`;
                      const body = [
                        "Automated PR created by Eventiva main-repo TDD workflow.",
                        "",
                        `- Main PR: ${process.env.MAIN_PR_URL ?? "n/a"}`,
                        `- Source branch: \`${headBranch}\``,
                        `- Target branch: \`${baseBranch}\``
                      ].join("\n");

                      const created = await github.rest.pulls.create({
                        owner,
                        repo,
                        title,
                        head: headBranch,
                        base: baseBranch,
                        body
                      });

                      core.info(`Created tests repo PR #${created.data.number}`);

    run-tdd-tests:
        name: Run tests via main repo Nx
        runs-on: ubuntu-latest
        needs: create-tests
        outputs:
            summary: ${{ steps.build_summary.outputs.summary }}
        env:
            BRANCH_NAME: ${{ github.head_ref }}
        steps:
            # Same fallback as create-tests: BOT_TOKEN needed for tests submodule fetch.
            - uses: actions/checkout@v6
              with:
                  token: ${{ secrets.BOT_TOKEN || github.token }}
                  fetch-depth: 0
                  submodules: 'recursive'

            - name: Checkout tests submodule to PR branch
              env:
                  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
              run: |
                  set -euo pipefail
                  git -C tests config user.name "eventiva-bot"
                  git -C tests config user.email "eventiva-bot@users.noreply.github.com"
                  git -C tests fetch origin --prune

                  default_branch="$(
                    curl -fsSL \
                      -H "Authorization: Bearer ${BOT_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      "https://api.github.com/repos/${TESTS_REPO}" | jq -r '.default_branch'
                  )"

                  if git -C tests ls-remote --exit-code --heads origin "${BRANCH_NAME}" > /dev/null 2>&1; then
                    git -C tests checkout -B "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
                  else
                    git -C tests checkout -B "${BRANCH_NAME}" "origin/${default_branch}"
                  fi

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.14.2

            - uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --no-frozen-lockfile

            - name: Build workspace for test execution
              run: pnpm nx run-many --exclude=eventiva -t build

            - name: Generate API-surface coverage manifests
              run: |
                  set -euo pipefail
                  if [ -f tests/tools/generate-api-surface-coverage.mjs ]; then
                    pnpm exec node tests/tools/generate-api-surface-coverage.mjs tests
                  else
                    echo "API-surface coverage tool not found; skipping."
                  fi

            - name: Run Nx tests with coverage gate
              id: run_tests
              run: |
                  set +e
                  pnpm nx run-many -t test --projects='tests-*' --outputStyle=static > test-output.log 2>&1
                  test_exit=$?
                  set -e
                  echo "test_exit=${test_exit}" >> "$GITHUB_OUTPUT"

            - name: Evaluate coverage reports
              id: coverage
              run: |
                  set -euo pipefail

                  shopt -s globstar nullglob
                  coverage_files=(coverage/**/coverage-summary.json tests/**/coverage/coverage-summary.json tests/.placeholder/coverage/coverage-summary.json)

                  if [ ${#coverage_files[@]} -eq 0 ]; then
                    echo "coverage_ok=false" >> "$GITHUB_OUTPUT"
                    echo "coverage_min=0" >> "$GITHUB_OUTPUT"
                    echo "No coverage summary files were generated." > coverage-summary.txt
                    exit 0
                  fi

                  min_coverage=100

                  for file in "${coverage_files[@]}"; do
                    lines=$(jq -r '.total.lines.pct // 0' "${file}")
                    funcs=$(jq -r '.total.functions.pct // 0' "${file}")
                    branches=$(jq -r '.total.branches.pct // 0' "${file}")

                    if ! [[ "${lines}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then lines=100; fi
                    if ! [[ "${funcs}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then funcs=100; fi
                    if ! [[ "${branches}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then branches=100; fi

                    file_min=$(printf "%s\n%s\n%s\n" "${lines}" "${funcs}" "${branches}" | sort -n | head -n 1)
                    min_coverage=$(printf "%s\n%s\n" "${min_coverage}" "${file_min}" | sort -n | head -n 1)
                  done

                  printf "Minimum coverage across reports: %s%%\n" "${min_coverage}" > coverage-summary.txt
                  echo "coverage_min=${min_coverage}" >> "$GITHUB_OUTPUT"

                  if awk "BEGIN { exit !(${min_coverage} >= 80) }"; then
                    echo "coverage_ok=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "coverage_ok=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build sanitized summary
              id: build_summary
              env:
                  TEST_EXIT: ${{ steps.run_tests.outputs.test_exit }}
                  COVERAGE_OK: ${{ steps.coverage.outputs.coverage_ok }}
                  COVERAGE_MIN: ${{ steps.coverage.outputs.coverage_min }}
              run: |
                  set -euo pipefail

                  rg -n "FAIL|Error:|AssertionError|Expected|expected" test-output.log --max-count 40 > raw-failures.txt || true

                  sed -E 's#[A-Za-z0-9_./-]+\.(spec|test)\.[jt]sx?##g' raw-failures.txt | \
                    sed -E 's#tests/##g' > sanitized-failures.txt

                  status="passed"
                  if [ "${TEST_EXIT}" -ne 0 ] || [ "${COVERAGE_OK}" != "true" ]; then
                    status="failed"
                  fi

                  {
                    echo "### TDD tests"
                    echo "- Status: ${status}"
                    echo "- Coverage: ${COVERAGE_MIN}% (threshold: 80%)"
                    if [ -s sanitized-failures.txt ]; then
                      echo "- Sanitized failures:"
                      echo '```text'
                      head -n 20 sanitized-failures.txt
                      echo '```'
                    else
                      echo "- Sanitized failures: none"
                    fi
                  } > tdd-summary.md

                  {
                    echo "summary<<EOF"
                    cat tdd-summary.md
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            - name: Create Linear bug for implementers when tests fail
              if: steps.run_tests.outputs.test_exit != '0' && secrets.LINEAR_API_KEY != '' && secrets.LINEAR_TEAM_ID != ''
              env:
                  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
                  LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
              continue-on-error: true
              run: |
                  set -euo pipefail
                  failures="$(sed -n '1,40p' sanitized-failures.txt || true)"
                  description="$(printf '%s\n\n%s\n%s\n\n%s\n%s\n\n%s' \
                    "TDD runner detected failing tests in main PR ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${{ github.event.pull_request.number }}." \
                    "Source: main repo implementation (packages/)." \
                    "Broad explanation: test execution failed against implementation." \
                    "Sanitized failures:" \
                    "${failures}" \
                    "Artifacts: tdd-summary.md, raw-failures.txt, sanitized-failures.txt, test-output.log.")"

                  payload="$(jq -n \
                    --arg teamId "${LINEAR_TEAM_ID}" \
                    --arg title "TDD test failure: implementer follow-up for PR #${{ github.event.pull_request.number }}" \
                    --arg description "${description}" \
                    '{query:"mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success } }", variables:{input:{teamId:$teamId, title:$title, description:$description}}}')"

                  curl -fsSL https://api.linear.app/graphql \
                    -H "Authorization: ${LINEAR_API_KEY}" \
                    -H "Content-Type: application/json" \
                    -d "${payload}" > /tmp/linear-bug-response.json

            - name: Create Linear task for test creators when coverage < 100% or unexpected
              if: (steps.coverage.outputs.coverage_ok != 'true' || steps.coverage.outputs.coverage_min != '100' || steps.run_tests.outputs.test_exit != '0') && secrets.LINEAR_API_KEY != '' && secrets.LINEAR_TEAM_ID != ''
              env:
                  LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
                  LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
                  COVERAGE_MIN: ${{ steps.coverage.outputs.coverage_min }}
              continue-on-error: true
              run: |
                  set -euo pipefail
                  description="$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
                    "TDD runner requires test-creator follow-up for PR ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${{ github.event.pull_request.number }}." \
                    "Source: main repo implementation (packages/)." \
                    "Broad explanation: coverage is below 100% or unexpected execution result." \
                    "Coverage summary: ${COVERAGE_MIN}% (gate threshold currently 80% for execution)." \
                    "Artifacts: coverage-summary.txt, tdd-summary.md, raw-failures.txt, sanitized-failures.txt.")"

                  payload="$(jq -n \
                    --arg teamId "${LINEAR_TEAM_ID}" \
                    --arg title "TDD coverage follow-up: test-creator task for PR #${{ github.event.pull_request.number }}" \
                    --arg description "${description}" \
                    '{query:"mutation CreateIssue($input: IssueCreateInput!) { issueCreate(input: $input) { success } }", variables:{input:{teamId:$teamId, title:$title, description:$description}}}')"

                  curl -fsSL https://api.linear.app/graphql \
                    -H "Authorization: ${LINEAR_API_KEY}" \
                    -H "Content-Type: application/json" \
                    -d "${payload}" > /tmp/linear-task-response.json

            - name: Upload test artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: tdd-test-artifacts
                  path: |
                      test-output.log
                      raw-failures.txt
                      sanitized-failures.txt
                      tdd-summary.md
                      coverage
                      tests/**/coverage
                      coverage-summary.txt
                  if-no-files-found: warn

            - name: Enforce test and coverage gate
              env:
                  TEST_EXIT: ${{ steps.run_tests.outputs.test_exit }}
                  COVERAGE_OK: ${{ steps.coverage.outputs.coverage_ok }}
              run: |
                  set -euo pipefail
                  if [ "${TEST_EXIT}" -ne 0 ]; then
                    echo "Tests failed."
                    exit 1
                  fi
                  if [ "${COVERAGE_OK}" != "true" ]; then
                    echo "Coverage is below threshold (80%) or missing."
                    exit 1
                  fi

    review-approve:
        name: Approve PR when TDD passes
        runs-on: ubuntu-latest
        needs: run-tdd-tests
        if: needs.run-tdd-tests.result == 'success'
        steps:
            - name: Submit approval review
              uses: actions/github-script@v8
              with:
                  github-token: ${{ secrets.BOT_TOKEN }}
                  script: |
                      const body = ${{ toJSON(needs.run-tdd-tests.outputs.summary) }} || "TDD checks passed."
                      await github.rest.pulls.createReview({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.payload.pull_request.number,
                        event: "APPROVE",
                        body
                      })

    review-request-changes:
        name: Request changes when TDD fails
        runs-on: ubuntu-latest
        needs: run-tdd-tests
        if: always() && needs.run-tdd-tests.result != 'success'
        steps:
            - name: Submit request changes review
              uses: actions/github-script@v8
              with:
                  github-token: ${{ secrets.BOT_TOKEN }}
                  script: |
                      const body = ${{ toJSON(needs.run-tdd-tests.outputs.summary) }} || "TDD checks failed."
                      await github.rest.pulls.createReview({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        pull_number: context.payload.pull_request.number,
                        event: "REQUEST_CHANGES",
                        body
                      })
