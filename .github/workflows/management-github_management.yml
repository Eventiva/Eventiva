name: Management - Github Management
on:
    issues:
        types: [opened, edited, reopened, labeled, unlabeled]
    pull_request:
        types: [opened, edited, synchronize, reopened, ready_for_review]
    pull_request_review:
        types: [submitted, dismissed]
    push:
        branches: [main]
    schedule:
        - cron: '0 6 * * *'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    smartcloud:
        name: smartcloud
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write
            issues: write
            pull-requests: write
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@v2.15.1
              with:
                  egress-policy: audit

            # smartcloud reads .github/smartcloud.yml from the default branch
            # through the API, so no checkout is needed.
            - name: smartcloud
              uses: Resnovas/smartcloud@v2
              with:
                  GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
