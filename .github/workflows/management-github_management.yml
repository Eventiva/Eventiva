name: Management - Github Management
on:
    issues:
        types: [opened, edited, closed, reopened]
    pull_request:
        types: [opened, edited, closed, reopened, synchronize]
    merge_group:

permissions:
    contents: read

jobs:
    release-mastermind:
        name: Release Mastermind
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@v2.15.1 # v2.6.1
              with:
                  egress-policy: audit

            - name: Workflow Telemetry
              uses: catchpoint/workflow-telemetry-action@v2.0.0 # v1.8.7
              with:
                  github_token: ${{ secrets.BOT_TOKEN || github.token }}
                  comment_on_pr: false
                  theme: dark
                  proc_trace_sys_enable: true

            - uses: actions/checkout@v6
              with:
                  token: ${{ secrets.BOT_TOKEN || github.token }}
                  submodules: 'recursive'

            - name: Check for config
              id: check_config
              run: |
                  if [ -f .github/config.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

            - name: Release Mastermind
              if: steps.check_config.outputs.exists == 'true'
              uses: Resnovas/smartcloud@1.0.0-beta.8 # 1.0.0-beta.8
              with:
                  GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
                  config: .github/config.json
                  configRef: main
