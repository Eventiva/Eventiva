name: CI

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    actions: read
    contents: read

jobs:
    main:
        runs-on: ubuntu-latest
        env:
            # NX_CLOUD_ACCESS_TOKEN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.NX_CLOUD_ACCESS_TOKEN_MAIN || secrets.NX_CLOUD_ACCESS_TOKEN }}
            # Run without Nx Cloud so CI does not fail when the cloud org is disabled (e.g. over FREE plan).
            # Remove this and set NX_CLOUD_ACCESS_TOKEN if you upgrade and want cloud cache/distribution.
            NX_NO_CLOUD: 'true'
        steps:
            - uses: actions/checkout@v6
              with:
                  filter: tree:0
                  fetch-depth: 0

            # This enables task distribution via Nx Cloud
            # Run this command as early as possible, before dependencies are installed
            # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
            # Uncomment this line to enable task distribution
            # - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.14.2

            - uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: 'pnpm'

            - run: pnpm install --no-frozen-lockfile

            # Prepend any command with "nx record --" to record its logs to Nx Cloud
            # - run: npx nx record -- echo Hello World
            # test target will be re-added when Vitest is configured
            - run: pnpm nx run-many --exclude=eventiva -t lint build typecheck
            - run: pnpm run dts:docs:enrich
            - run: pnpm run dts:docs:check
            # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/ci/features/self-healing-ci
            - run: pnpm nx fix-ci
              if: always()
