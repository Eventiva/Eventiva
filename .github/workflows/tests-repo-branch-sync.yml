name: Tests Repo Branch Sync

on:
    push:
        branches-ignore:
            - main

permissions:
    contents: read

jobs:
    ensure-tests-repo-branch:
        runs-on: ubuntu-latest
        steps:
            - name: Ensure matching branch exists in Eventiva/tests
              uses: actions/github-script@v8
              env:
                  TESTS_REPO: Eventiva/tests
              with:
                  github-token: ${{ secrets.BOT_TOKEN }}
                  script: |
                      const branchName = context.ref.replace("refs/heads/", "");
                      const [owner, repo] = (process.env.TESTS_REPO ?? "").split("/");

                      if (!owner || !repo) {
                        core.setFailed("TESTS_REPO must be set as <owner>/<repo>.");
                        return;
                      }

                      core.info(`Ensuring branch '${branchName}' exists in ${owner}/${repo}`);

                      const { data: testsRepo } = await github.rest.repos.get({ owner, repo });
                      const defaultBranch = testsRepo.default_branch;

                      try {
                        await github.rest.git.getRef({
                          owner,
                          repo,
                          ref: `heads/${branchName}`
                        });
                        core.info(`Branch '${branchName}' already exists in ${owner}/${repo}.`);
                        return;
                      } catch (error) {
                        if (error.status !== 404) {
                          throw error;
                        }
                      }

                      const { data: baseRef } = await github.rest.git.getRef({
                        owner,
                        repo,
                        ref: `heads/${defaultBranch}`
                      });

                      await github.rest.git.createRef({
                        owner,
                        repo,
                        ref: `refs/heads/${branchName}`,
                        sha: baseRef.object.sha
                      });

                      core.info(`Created '${branchName}' from '${defaultBranch}'.`);
