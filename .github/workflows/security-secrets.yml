name: Security - GitGuardian scan

on:
    merge_group:
    push:
        branches:
            - main
            - develop
            - release/*
    pull_request:
        branches:
            - main
            - develop
            - release/*

permissions:
    contents: read

jobs:
    scanning:
        name: GitGuardian scan
        runs-on: ubuntu-latest
        steps:
            - name: Harden Runner
              uses: step-security/harden-runner@v2.15.1 # v2.6.1
              with:
                  egress-policy: audit

            - name: Workflow Telemetry
              uses: catchpoint/workflow-telemetry-action@v2.0.0 # v1.8.7
              with:
                  github_token: ${{ secrets.BOT_TOKEN || github.token }}
                  comment_on_pr: false
                  theme: dark
                  proc_trace_sys_enable: true

            # This check does not require submodules; avoid private submodule fetch failures.
            - uses: actions/checkout@v6
              with:
                  submodules: false

            - name: Create SSH key
              env:
                  BOT_GIT_SSH_KEY: ${{ secrets.BOT_GIT_SSH_KEY }}
                  GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
                  GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
              if: env.BOT_GIT_SSH_KEY != '' && env.GIT_USER_NAME != '' && env.GIT_USER_EMAIL != ''
              run: |
                  mkdir -p ~/.ssh/
                  echo "${{ env.BOT_GIT_SSH_KEY }}" > ~/.ssh/id_rsa
                  chmod 600 ~/.ssh/id_rsa
                  ssh-keyscan github.com >> ~/.ssh/known_hosts
                  chmod 644 ~/.ssh/known_hosts

            - name: Ensure git is using the SSH key
              env:
                  BOT_GIT_SSH_KEY: ${{ secrets.BOT_GIT_SSH_KEY }}
                  GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
                  GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
              if: env.BOT_GIT_SSH_KEY != '' && env.GIT_USER_NAME != '' && env.GIT_USER_EMAIL != ''
              run: |
                  eval "$(ssh-agent -s)"
                  ssh-add ~/.ssh/id_rsa
                  ssh-add -l | grep -q "$(ssh-keygen -lf ~/.ssh/id_rsa | awk '{print $2}')" || (echo "Failed to add SSH key" && exit 1)

            - name: Setup git & npm
              env:
                  BOT_GIT_SSH_KEY: ${{ secrets.BOT_GIT_SSH_KEY }}
                  GIT_USER_NAME: ${{ secrets.GIT_USER_NAME }}
                  GIT_USER_EMAIL: ${{ secrets.GIT_USER_EMAIL }}
              if: env.BOT_GIT_SSH_KEY != '' && env.GIT_USER_NAME != '' && env.GIT_USER_EMAIL != ''
              run: |
                  git config --global user.name "${{ env.GIT_USER_NAME }}"
                  git config --global user.email "${{ env.GIT_USER_EMAIL }}"
                  git config --global core.sshCommand "ssh -i ~/.ssh/id_rsa -o UserKnownHostsFile=~/.ssh/known_hosts"
                  git config --global gpg.format ssh
                  git config --global user.signingkey ~/.ssh/id_rsa
                  git config --global commit.gpgsign true
                  git config --global tag.gpgsign true

            - name: GitGuardian scan
              if: env.GITGUARDIAN_API_KEY != ''
              uses: GitGuardian/ggshield-action@v1.48.0
              env:
                  GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
                  GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
                  GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
                  GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  GITHUB_TOKEN: ${{ secrets.BOT_TOKEN || github.token }}
