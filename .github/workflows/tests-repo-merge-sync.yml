name: Tests Repo Merge Sync

on:
    pull_request:
        types:
            - closed

permissions:
    contents: read

jobs:
    merge-tests-repo-branch:
        if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
        runs-on: ubuntu-latest
        steps:
            - name: Merge matching branch into tests repo default branch
              uses: actions/github-script@v8
              env:
                  TESTS_REPO: Eventiva/tests
              with:
                  github-token: ${{ secrets.BOT_TOKEN }}
                  script: |
                      const headBranch = context.payload.pull_request.head.ref;
                      const [owner, repo] = (process.env.TESTS_REPO ?? "").split("/");

                      if (!owner || !repo) {
                        core.setFailed("TESTS_REPO must be set as <owner>/<repo>.");
                        return;
                      }

                      const { data: testsRepo } = await github.rest.repos.get({ owner, repo });
                      const base = testsRepo.default_branch;

                      try {
                        const result = await github.request("POST /repos/{owner}/{repo}/merges", {
                          owner,
                          repo,
                          base,
                          head: headBranch
                        });
                        core.info(`Merged ${headBranch} into ${base} in ${owner}/${repo}: ${result.status}`);
                      } catch (error) {
                        if ([404, 409, 422].includes(error.status)) {
                          core.warning(`Skipping merge sync (${error.status}): ${error.message}`);
                          return;
                        }
                        throw error;
                      }
