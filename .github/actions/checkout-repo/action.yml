# Lightweight checkout: repo + submodules. No pnpm/node.
# Use for security scans, management, and chore workflows that don't need the full build.
name: Checkout Repo
description: Checkout repository with submodules

inputs:
  token:
    description: Token for checkout (BOT_TOKEN for private submodules)
    required: false
    default: ''
  fetch-depth:
    description: Git fetch depth (0 = full history)
    required: false
    default: '0'
  submodules:
    description: Submodule checkout mode
    required: false
    default: 'recursive'
  filter:
    description: Sparse checkout filter (e.g. tree:0). Omit for full clone.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ inputs.token || github.token }}
        fetch-depth: ${{ inputs.fetch-depth }}
        submodules: ${{ inputs.submodules }}
        filter: ${{ inputs.filter }}
