# Setup SSH key and git config for signed commits/pushes.
# Use when workflow needs to push to the repo (e.g. chore, Snyk).
name: Git SSH Setup
description: Create SSH key, configure git for signing

inputs:
  ssh-key:
    description: SSH private key content
    required: true
  user-name:
    description: Git user name
    required: true
  user-email:
    description: Git user email
    required: true

runs:
  using: composite
  steps:
    - name: Create SSH key
      run: |
        mkdir -p ~/.ssh/
        echo "${{ inputs.ssh-key }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan github.com >> ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts
      shell: bash

    - name: Ensure git is using the SSH key
      run: |
        eval "$(ssh-agent -s)"
        ssh-add ~/.ssh/id_rsa
        ssh-add -l | grep -q "$(ssh-keygen -lf ~/.ssh/id_rsa | awk '{print $2}')" || (echo "Failed to add SSH key" && exit 1)
      shell: bash

    - name: Setup git for signing
      run: |
        git config --global user.name "${{ inputs.user-name }}"
        git config --global user.email "${{ inputs.user-email }}"
        git config --global core.sshCommand "ssh -i ~/.ssh/id_rsa -o UserKnownHostsFile=~/.ssh/known_hosts"
        git config --global gpg.format ssh
        git config --global user.signingkey ~/.ssh/id_rsa
        git config --global commit.gpgsign true
        git config --global tag.gpgsign true
      shell: bash
